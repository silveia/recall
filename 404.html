<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>:p</title>
<!-- a section's name at the end goes to that section; anything else to the front door -->
<meta name="robots" content="noindex">
<script>
(function () {
    var pages = ['home', 'cards', 'audio', 'player', 'chat'];
    var parts = location.pathname.split('/').filter(Boolean);
    var want = parts[parts.length - 1];
    location.replace((pages.indexOf(want) > -1 ? '/' + want + '/' : '/') + location.hash);
}());
</script>
<meta http-equiv="refresh" content="0; url=/">
</head>
<body><a href="/">home</a></body>
</html>
