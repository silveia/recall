<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>draw</title>
    <script>
        // the lights follow the page this is framed in, before anything is drawn
        // the site says the lights in the address (#dark) when it first loads this page, which works
        // however the site is opened
        if (location.hash.indexOf('dark') >= 0) document.documentElement.classList.add('inverted');
        else try {
            var on = window.parent !== window
                ? window.parent.document.documentElement.classList.contains('inverted')
                : localStorage.getItem('page-inverted') === 'yes';
            if (on) document.documentElement.classList.add('inverted');
        } catch (error) { /* keeps the light */ }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiko:wght@400&amp;family=Pixelify+Sans:wght@400&amp;family=VT323&amp;display=swap">
    <script>
        // framed in the site, the site's colour layer lies over this page: everything black stays black
        // here and the layer colours it (only the canvas is cut out of it, by the site)
        if (window.parent !== window) document.documentElement.classList.add('tint-layer');
    </script>
    <script src="../tint.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="toolbar">
        <div class="toolbar-group">
            <div class="field">
                <div class="pick" id="colourPick">
                    <button type="button" class="pick-face colour-face" aria-haspopup="true" aria-expanded="false" title="colour"><span class="colour-dot"></span></button>
                    <div class="pick-menu tint" hidden>
                        <!-- a real colour adjuster: shade and brightness in the square, hue on the strip, and the code itself -->
                        <div class="tint-field" id="tintField" role="slider" tabindex="0" aria-label="shade and brightness" title="shade and brightness"><span class="tint-ring" id="tintRing"></span></div>
                        <div class="tint-hue" id="tintHue" role="slider" tabindex="0" aria-label="hue" title="hue" aria-valuemin="0" aria-valuemax="360"><span class="tint-ring" id="hueRing"></span></div>
                        <label class="tint-code"><span class="tint-now" id="tintNow"></span><span class="tint-hash">#</span><input type="text" id="tintCode" maxlength="6" spellcheck="false" autocomplete="off" aria-label="colour code"></label>
                    </div>
                    <input type="color" id="colorPicker" class="kept-under" value="#000000" tabindex="-1" aria-hidden="true">
                </div>
            </div>

            <!-- the tool and the colour are the site's own menus; the real select and colour field stay
                 underneath (script.js reads them) and are set from here -->
            <div class="field">
                <!-- the tool is one bare mark: the pen or the eraser, swapped (with a spin) on every press -->
                <button type="button" class="bare-mark tool-swap" id="toolSwap" title="pen" aria-label="pen — press for the eraser">
                    <span class="tool-turn" id="toolTurn">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path class="tool-pen" d="M5 19l1-4L16 5l3 3L9 18z"/><path class="tool-rub" d="M14.6 4.6a2 2 0 0 1 2.8 0l2 2a2 2 0 0 1 0 2.8L10 18.8H6.4L4.6 17a2 2 0 0 1 0-2.8z M9.2 9.9l4.9 4.9"/></svg>
                    </span>
                </button>
                <select id="brushType" class="kept-under" tabindex="-1" aria-hidden="true">
                    <option value="round">round brush</option>
                    <option value="eraser">eraser</option>
                </select>
            </div>

            <!-- the size: a slider in one outlined pill with less and more at its two ends, and how many
                 art pixels across beside it -->
            <div class="field size-field">
                <div class="size-step" id="sizeStep">
                    <button type="button" class="step-less" tabindex="-1" title="smaller" aria-label="smaller"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M7 12h10"/></svg></button>
                    <div class="size-track" id="sizeTrack" role="slider" tabindex="0" title="size" aria-label="size" aria-valuemin="1" aria-valuemax="64"><span class="size-done" id="sizeDone"></span><span class="size-thumb" id="sizeThumb"></span></div>
                    <button type="button" class="step-more" tabindex="-1" title="bigger" aria-label="bigger"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M12 7v10M7 12h10"/></svg></button>
                </div>
                <span class="size-read" id="sizeRead">2px</span>
                <input type="range" id="brushSize" class="kept-under" min="1" max="64" value="2" tabindex="-1" aria-hidden="true">
            </div>

            <!-- undo and redo, bare marks, the same as ctrl/cmd z and y -->
            <div class="field history">
                <button type="button" class="bare-mark" id="undoBtn" title="undo" aria-label="undo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5 5 9l4 4"/><path d="M5 9h9a5 5 0 0 1 0 10h-2"/></svg></button>
                <button type="button" class="bare-mark" id="redoBtn" title="redo" aria-label="redo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 5 4 4-4 4"/><path d="M19 9h-9a5 5 0 0 0 0 10h2"/></svg></button>
            </div>
        </div>

        <div class="toolbar-group">
            <label class="uploadBtn" for="imageLoader">upload stamp</label>
            <input type="file" id="imageLoader" accept="image/*" style="display: none;">

            <label class="uploadBtn" for="charLoader">upload sprite</label>
            <input type="file" id="charLoader" accept="image/*" style="display: none;">

            <span class="spawn-wrap">
                <button id="spawnBtn" type="button">spawn sprite</button>
                <span class="sprite-hint" id="spriteHint" role="status" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 18 7 7M7 14V7h7"/></svg>pls upload sprite first</span>
            </span>
            <button id="clearBtn" type="button" class="is-solid">clear</button>
        </div>
    </div>

    <div id="canvas-container">
        <canvas id="paintCanvas" width="1200" height="800"></canvas>

        <div class="corner-buttons">
            <button id="referenceBtn" type="button" title="reference" aria-label="Open Reference Window">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="14" rx="2.5"/><circle cx="9" cy="10" r="1.6"/><path d="M4.5 17.5l5-4.5 3.5 3 2.5-2 4 3.5"/></svg>
            </button>
            <button id="gameBtn" type="button" title="yams" aria-label="Open Yams Window">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7.5 8h9a4 4 0 0 1 4 4.4l-.5 3.6a2.4 2.4 0 0 1-4.2 1.2L14.2 15H9.8l-1.6 2.2A2.4 2.4 0 0 1 4 16l-.5-3.6A4 4 0 0 1 7.5 8z"/><path d="M8 10.5v3M6.5 12h3"/><circle cx="15.5" cy="11" r="0.5" fill="currentColor"/><circle cx="17" cy="13" r="0.5" fill="currentColor"/></svg>
            </button>
        </div>
    </div>

    <div id="miniWindow" class="hidden-window">
        <div id="windowHeader">
            <span>yams</span>
            <div>
                <button id="resetGameBtn" type="button" title="back to the start" aria-label="back to the start"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18.5 12a6.5 6.5 0 1 1-1.9-4.6M18.5 4.5v3.5H15"/></svg></button>
                <button id="closeWindowBtn" type="button" title="close" aria-label="close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg></button>
            </div>
        </div>
        <div id="windowContent">
            <div id="startScreen">
                <button id="startGameBtn" type="button" class="is-solid">start</button>
            </div>
            <div id="gameScreen" class="hidden-game-element">
                <div id="gameViewport">
                    <div id="coinCounterDisplay">
                        <span class="coin-icon">🪙</span> x <span id="coinScoreValue">0</span>
                    </div>
                    <div id="gameWorldBackground">
                        <div id="gamePlayer"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="miniWindow2" class="hidden-window">
        <div id="windowHeader2">
            <span>reference</span>
            <button id="closeWindowBtn2" type="button" title="close" aria-label="close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg></button>
        </div>

        <div class="windowContent2">
            <label for="windowImageLoader" id="uploadBtn" title="upload a picture" style="display: inline-block;">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15.5V5M7.5 9.5 12 5l4.5 4.5M5 15v3.5h14V15"/></svg>
            </label>
            <input type="file" id="windowImageLoader" accept="image/*" style="display: none;">

            <img id="referenceImage" src="" alt="Preview" style="display: none; max-width: 100%; height: auto;">
            <span id="uploadPlaceholder">upload file to view it here</span>
        </div>
    </div>

    <script src="game.js"></script>
    <script src="script.js"></script>
    <script>
        // the two menus in the toolbar: a press opens one, a row picks, anywhere else or escape shuts it
        (function () {
            var picks = Array.prototype.slice.call(document.querySelectorAll('.pick'));
            // in: the box unrolls down out of its button (the colour adjuster instead grows from its dot) — revealed top to bottom with a clip, nothing
            // scaled, so the words and the 1px outline stay crisp the whole way. out: it rolls back up,
            // quicker. either starts from wherever the other left off, so a quick open-and-shut never jumps
            var SHUT = 'inset(0 0 100% 0 round 14px)', OPEN = 'inset(0 0 0 0 round 14px)';
            var roll = function (menu, opening, time, easing) {
                var shape = menu.shapes || { shut: SHUT, open: OPEN };
                var to = opening ? shape.open : shape.shut;
                var from = menu.moving ? getComputedStyle(menu).clipPath : (opening ? shape.shut : shape.open);
                var fade = menu.moving ? getComputedStyle(menu).opacity : (opening ? '0' : '1');
                if (menu.moving) menu.moving.cancel();
                menu.moving = menu.animate([
                    { clipPath: from, opacity: fade },
                    { clipPath: to, opacity: opening ? 1 : (menu.shapes ? 1 : 0) }
                ], { duration: time, easing: easing, fill: 'forwards' });
                return menu.moving;
            };
            var openMenu = function (pick) {
                var face = pick.querySelector('.pick-face');
                var menu = pick.querySelector('.pick-menu');
                menu.hidden = false;
                menu.isOpen = true;
                face.setAttribute('aria-expanded', 'true');
                // the colour adjuster opens on the canvas's own top-left corner, its edges on the canvas's
                if (pick.id === 'colourPick') {
                    var sheet = document.getElementById('canvas-container').getBoundingClientRect();
                    var here = pick.getBoundingClientRect();
                    menu.style.left = (sheet.left - here.left) + 'px';
                    menu.style.top = (sheet.top - here.top) + 'px';
                    // it grows out of the colour dot as a circle, and shrinks back into it: the circle's
                    // middle is the dot's, and open it reaches the adjuster's farthest corner
                    var dot = face.querySelector('.colour-dot').getBoundingClientRect();
                    var cx = dot.left + dot.width / 2 - sheet.left, cy = dot.top + dot.height / 2 - sheet.top;
                    var reach = Math.ceil(Math.hypot(Math.max(cx, menu.offsetWidth - cx), Math.max(cy, menu.offsetHeight - cy))) + 2;
                    var at = ' at ' + cx.toFixed(1) + 'px ' + cy.toFixed(1) + 'px)';
                    menu.shapes = { shut: 'circle(' + (dot.width / 2) + 'px' + at, open: 'circle(' + reach + 'px' + at };
                    // then what is in it comes in one after another: the square, the strip, the code
                    // with the site's colour on they only slide: they are cut out of the colour layer, and a
                    // part fading in a hole shows the black under it first
                    if (!menu.moving) {
                        var still = document.documentElement.classList.contains('tinted') ? 1 : 0;
                        Array.prototype.forEach.call(menu.children, function (part, i) {
                            part.animate([
                                { opacity: still, transform: 'translateY(8px)' },
                                { opacity: 1, transform: 'none' }
                            ], { duration: 360, delay: 110 + i * 70, easing: 'cubic-bezier(0.22, 1, 0.36, 1)', fill: 'backwards' });
                        });
                    }
                }
                var growing = pick.id === 'colourPick';
                roll(menu, true, growing ? 460 : 240, growing ? 'cubic-bezier(0.5, 0, 0.15, 1)' : 'cubic-bezier(0.22, 1, 0.36, 1)').onfinish = function () {
                    if (!menu.isOpen) return;
                    menu.moving.cancel();
                    menu.moving = null;
                };
            };
            var closeMenu = function (pick) {
                var face = pick.querySelector('.pick-face');
                var menu = pick.querySelector('.pick-menu');
                if (!menu.isOpen) return;
                menu.isOpen = false;
                face.setAttribute('aria-expanded', 'false');
                var shrinking = pick.id === 'colourPick';
                roll(menu, false, shrinking ? 300 : 170, shrinking ? 'cubic-bezier(0.55, 0, 0.75, 0.2)' : 'cubic-bezier(0.4, 0, 0.6, 1)').onfinish = function () {
                    if (menu.isOpen) return;
                    menu.hidden = true;
                    menu.moving.cancel();
                    menu.moving = null;
                };
            };
            var shut = function (except) {
                picks.forEach(function (pick) { if (pick !== except) closeMenu(pick); });
            };
            picks.forEach(function (pick) {
                var face = pick.querySelector('.pick-face');
                var menu = pick.querySelector('.pick-menu');
                face.addEventListener('click', function () {
                    shut(pick);
                    if (menu.isOpen) closeMenu(pick); else openMenu(pick);
                });
            });
            document.addEventListener('pointerdown', function (event) {
                if (!event.target.closest('.pick')) shut(null);
            }, true);
            window.addEventListener('keydown', function (event) { if (event.key === 'Escape') shut(null); });
            window.addEventListener('blur', function () { shut(null); });

            // the tool: one press swaps pen and eraser on the select underneath and tells script.js, the
            // way choosing in it would. the mark changes face at once and spins one turn as it does
            var tool = document.getElementById('brushType');
            var swap = document.getElementById('toolSwap');
            var turn = document.getElementById('toolTurn');
            var shown = null;
            var paintTool = function () {
                var rubbing = tool.value === 'eraser';
                if (shown === rubbing) return;
                shown = rubbing;
                turn.classList.toggle('is-rubbing', rubbing);
                swap.title = rubbing ? 'eraser' : 'pen';
                swap.setAttribute('aria-label', rubbing ? 'eraser — press for the pen' : 'pen — press for the eraser');
            };
            var spinning = null;
            swap.addEventListener('click', function () {
                tool.value = tool.value === 'eraser' ? 'round' : 'eraser';
                tool.dispatchEvent(new Event('change'));
                paintTool();                       // the face changes on the press itself; the spin plays over it
                if (spinning) spinning.cancel();
                // pen to eraser turns clockwise, eraser back to pen turns the other way
                var way = tool.value === 'eraser' ? 1 : -1;
                spinning = turn.animate([
                    { transform: 'rotate(0deg) scale(1)' },
                    { offset: 0.4, transform: 'rotate(' + (160 * way) + 'deg) scale(0.8)' },
                    { transform: 'rotate(' + (360 * way) + 'deg) scale(1)' }
                ], { duration: 380, easing: 'cubic-bezier(0.22, 1, 0.36, 1)' });
            });
            // a pen's own eraser end switches the tool from script.js without telling anyone
            window.addEventListener('pointerup', paintTool);
            paintTool();

            // the colour: a square for shade and brightness, a strip for hue, and the code to type — every
            // colour there is, set straight on the colour field underneath that script.js reads
            var colour = document.getElementById('colorPicker');
            var colourPick = document.getElementById('colourPick');
            var field = document.getElementById('tintField');
            var ring = document.getElementById('tintRing');
            var hueStrip = document.getElementById('tintHue');
            var hueRing = document.getElementById('hueRing');
            var code = document.getElementById('tintCode');
            var now = document.getElementById('tintNow');
            var hsv = { h: 0, s: 0, v: 0 };
            var toHex = function (h, s, v) {
                var f = function (n) {
                    var k = (n + h / 60) % 6;
                    var c = v - v * s * Math.max(0, Math.min(k, 4 - k, 1));
                    return ('0' + Math.round(c * 255).toString(16)).slice(-2);
                };
                return '#' + f(5) + f(3) + f(1);
            };
            var fromHex = function (hex) {
                var r = parseInt(hex.slice(1, 3), 16) / 255, g = parseInt(hex.slice(3, 5), 16) / 255, b = parseInt(hex.slice(5, 7), 16) / 255;
                var most = Math.max(r, g, b), least = Math.min(r, g, b), d = most - least, h = 0;
                if (d) h = most === r ? ((g - b) / d) % 6 : most === g ? (b - r) / d + 2 : (r - g) / d + 4;
                return { h: d ? (h * 60 + 360) % 360 : hsv.h, s: most ? d / most : 0, v: most };
            };
            var paintColour = function (keepCode) {
                colourPick.querySelector('.colour-dot').style.background = colour.value;
                now.style.background = colour.value;
                field.style.setProperty('--hue', 'hsl(' + hsv.h + ', 100%, 50%)');
                ring.style.left = (hsv.s * 100) + '%';
                ring.style.top = ((1 - hsv.v) * 100) + '%';
                hueRing.style.left = (hsv.h / 360 * 100) + '%';
                hueStrip.setAttribute('aria-valuenow', String(Math.round(hsv.h)));
                if (!keepCode) code.value = colour.value.slice(1);
            };
            var setColour = function (keepCode) {
                colour.value = toHex(hsv.h, hsv.s, hsv.v);
                colour.dispatchEvent(new Event('input'));
                paintColour(keepCode);
            };
            var drag = function (el, take) {
                var at = function (event) {
                    var box = el.getBoundingClientRect();
                    take(Math.max(0, Math.min(1, (event.clientX - box.left) / box.width)),
                         Math.max(0, Math.min(1, (event.clientY - box.top) / box.height)));
                    setColour();
                };
                el.addEventListener('pointerdown', function (event) {
                    event.preventDefault();
                    el.setPointerCapture(event.pointerId);
                    el.classList.add('is-held');
                    at(event);
                });
                el.addEventListener('pointermove', function (event) { if (el.hasPointerCapture(event.pointerId)) at(event); });
                el.addEventListener('pointerup', function () { el.classList.remove('is-held'); });
                el.addEventListener('pointercancel', function () { el.classList.remove('is-held'); });
            };
            drag(field, function (x, y) { hsv.s = x; hsv.v = 1 - y; });
            drag(hueStrip, function (x) { hsv.h = Math.min(359.9, x * 360); });
            field.addEventListener('keydown', function (event) {
                var moves = { ArrowLeft: [-0.02, 0], ArrowRight: [0.02, 0], ArrowUp: [0, 0.02], ArrowDown: [0, -0.02] }[event.key];
                if (!moves) return;
                event.preventDefault();
                hsv.s = Math.max(0, Math.min(1, hsv.s + moves[0]));
                hsv.v = Math.max(0, Math.min(1, hsv.v + moves[1]));
                setColour();
            });
            hueStrip.addEventListener('keydown', function (event) {
                var step = event.key === 'ArrowRight' || event.key === 'ArrowUp' ? 4 : event.key === 'ArrowLeft' || event.key === 'ArrowDown' ? -4 : 0;
                if (!step) return;
                event.preventDefault();
                hsv.h = (hsv.h + step + 360) % 360;
                setColour();
            });
            // the code: taken as soon as it is a whole colour (three or six hex figures)
            code.addEventListener('input', function () {
                var typed = code.value.replace(/[^0-9a-f]/gi, '').slice(0, 6);
                if (typed !== code.value) code.value = typed;
                if (typed.length === 3) typed = typed.split('').map(function (c) { return c + c; }).join('');
                if (typed.length !== 6) return;
                hsv = fromHex('#' + typed.toLowerCase());
                setColour(true);
            });
            code.addEventListener('blur', function () { paintColour(); });
            code.addEventListener('keydown', function (event) { if (event.key === 'Enter') { event.preventDefault(); shut(null); } });
            colour.addEventListener('input', function () { if (colour.value !== toHex(hsv.h, hsv.s, hsv.v)) { hsv = fromHex(colour.value); paintColour(); } });
            hsv = fromHex(colour.value);
            paintColour();

            // the size: the slider is dragged or pressed anywhere along it; less and more at its ends step
            // it (held, they keep stepping); the wheel and the arrow keys nudge it. it sets the range
            // underneath and tells script.js the way the range itself would
            var size = document.getElementById('brushSize');
            var step = document.getElementById('sizeStep');
            var track = document.getElementById('sizeTrack');
            var thumb = document.getElementById('sizeThumb');
            var read = document.getElementById('sizeRead');
            var most = Number(size.max), least = Number(size.min);
            var paintSize = function () {
                var v = Number(size.value);
                read.textContent = v + 'px';
                thumb.style.left = ((v - least) / (most - least) * 100) + '%';
                document.getElementById('sizeDone').style.width = thumb.style.left;
                track.setAttribute('aria-valuenow', String(v));
            };
            var setSize = function (v) {
                v = Math.max(least, Math.min(most, Math.round(v)));
                if (String(v) === size.value) { paintSize(); return; }
                size.value = String(v);
                size.dispatchEvent(new Event('input'));
                paintSize();
            };
            var fromPointer = function (event) {
                var box = track.getBoundingClientRect();
                var t = Math.max(0, Math.min(1, (event.clientX - box.left) / box.width));
                setSize(least + t * (most - least));
            };
            track.addEventListener('pointerdown', function (event) {
                event.preventDefault();
                track.setPointerCapture(event.pointerId);
                track.classList.add('is-held');
                fromPointer(event);
            });
            track.addEventListener('pointermove', function (event) { if (track.hasPointerCapture(event.pointerId)) fromPointer(event); });
            var letGo = function () { track.classList.remove('is-held'); };
            track.addEventListener('pointerup', letGo);
            track.addEventListener('pointercancel', letGo);
            var holdTimer = 0;
            var stopHold = function () { clearTimeout(holdTimer); holdTimer = 0; };
            [['.step-less', -1], ['.step-more', 1]].forEach(function (pair) {
                var button = step.querySelector(pair[0]);
                button.addEventListener('pointerdown', function (event) {
                    event.preventDefault();
                    setSize(Number(size.value) + pair[1]);
                    // held, it keeps going: a beat first, then quicker
                    var again = function (wait) {
                        holdTimer = setTimeout(function () { setSize(Number(size.value) + pair[1]); again(Math.max(35, wait * 0.85)); }, wait);
                    };
                    stopHold();
                    holdTimer = setTimeout(function () { again(90); }, 380);
                });
                ['pointerup', 'pointerleave', 'pointercancel'].forEach(function (name) { button.addEventListener(name, stopHold); });
            });
            step.addEventListener('wheel', function (event) {
                event.preventDefault();
                setSize(Number(size.value) + (event.deltaY < 0 || event.deltaX > 0 ? 1 : -1));
            }, { passive: false });
            track.addEventListener('keydown', function (event) {
                var v = Number(size.value);
                if (event.key === 'ArrowRight' || event.key === 'ArrowUp') { event.preventDefault(); setSize(v + 1); }
                if (event.key === 'ArrowLeft' || event.key === 'ArrowDown') { event.preventDefault(); setSize(v - 1); }
            });
            // the tool switching (or a pen's eraser end) puts that tool's own size back into the range
            document.getElementById('brushType').addEventListener('change', paintSize);
            window.addEventListener('pointerup', paintSize);
            paintSize();

            document.getElementById('undoBtn').addEventListener('click', function () { executeUndo(); });
            document.getElementById('redoBtn').addEventListener('click', function () { executeRedo(); });

            // spawn with no sprite: a note drops in under the button, its arrow at upload sprite beside it
            var hint = document.getElementById('spriteHint');
            var hintTimer = 0;
            window.askForSprite = function () {
                clearTimeout(hintTimer);
                hint.hidden = false;
                hint.classList.remove('is-leaving');
                hint.style.animation = 'none';
                void hint.offsetWidth;          // so a second press plays the drop again
                hint.style.animation = '';
                hintTimer = setTimeout(function () {
                    hint.classList.add('is-leaving');
                    hintTimer = setTimeout(function () { hint.hidden = true; }, 200);
                }, 2400);
            };
        })();
    </script>
    <script>
        // framed in the site, the lights change with it
        (function () {
            var take = function (on) {
                var root = document.documentElement;
                if (root.classList.contains('inverted') === on) return;
                root.classList.add('theming');           // the swap is instant: no fade lags behind it
                root.classList.toggle('inverted', on);
                requestAnimationFrame(function () { requestAnimationFrame(function () { root.classList.remove('theming'); }); });
            };
            try {
                var host = window.parent.document.documentElement;
                if (host !== document.documentElement) {
                    new MutationObserver(function () { take(host.classList.contains('inverted')); })
                        .observe(host, { attributes: true, attributeFilter: ['class'] });
                }
            } catch (error) { /* not ours to read */ }
            // the page sends the lights and the colour (by message: opened as a file, this page may not
            // read the page it sits in, and the page may not read this one)
            window.addEventListener('message', function (event) {
                if (event.source !== window.parent || !event.data) return;
                if (typeof event.data.lights === 'boolean') take(event.data.lights);
                if ('tint' in event.data && window.siteTint) window.siteTint.apply(event.data.tint);
            });

            // and this page tells the page what must keep its own colours, in this page's own pixels: the
            // sheet (where it shows inside its box, rounded like it), and over it the corner buttons, any
            // open window and the inside of it, the colour dot and, while it is open, the colour adjuster
            if (window.parent === window) return;
            var holes = function () {
                // filled even-odd by the page: the sheet is a hole; what puts the layer back over it (a button,
                // a window, the open adjuster) is cut to the sheet, or the part of it off the sheet would turn
                // into a hole; what takes the layer out again (a window's inside, the colour square, the dot)
                // is taken whole
                var out = [], sheetBox = null;
                var shown = function (el) { return el && !el.hidden && !el.closest('[hidden], .hidden-window'); };
                var push = function (l, t, r, btm, round) { if (r > l && btm > t) out.push({ left: l, top: t, width: r - l, height: btm - t, round: round }); };
                var whole = function (el) {
                    if (!shown(el)) return;
                    var b = el.getBoundingClientRect();
                    push(b.left, b.top, b.right, b.bottom, parseFloat(getComputedStyle(el).borderTopLeftRadius) || 0);
                };
                var overSheet = function (el) {
                    if (!shown(el) || !sheetBox) return;
                    var b = el.getBoundingClientRect();
                    push(Math.max(b.left, sheetBox.left), Math.max(b.top, sheetBox.top), Math.min(b.right, sheetBox.right), Math.min(b.bottom, sheetBox.bottom),
                        parseFloat(getComputedStyle(el).borderTopLeftRadius) || 0);
                };
                var box = document.getElementById('canvas-container'), sheet = document.getElementById('paintCanvas');
                if (box && sheet) {
                    var b = box.getBoundingClientRect(), c = sheet.getBoundingClientRect(), i = box.clientLeft;
                    sheetBox = { left: Math.max(b.left + i, c.left), top: Math.max(b.top + i, c.top), right: Math.min(b.right - i, c.right), bottom: Math.min(b.bottom - i, c.bottom) };
                    push(sheetBox.left, sheetBox.top, sheetBox.right, sheetBox.bottom, Math.max(0, (parseFloat(getComputedStyle(box).borderTopLeftRadius) || 0) - i));
                }
                document.querySelectorAll('.corner-buttons button').forEach(overSheet);
                ['miniWindow', 'miniWindow2'].forEach(function (id) {
                    var win = document.getElementById(id);
                    if (!win || win.classList.contains('hidden-window')) return;
                    overSheet(win);
                    whole(win.querySelector('#windowContent, .windowContent2'));
                });
                whole(document.querySelector('.colour-dot'));
                var pop = document.querySelector('.tint');
                if (pop && !pop.hidden) { overSheet(pop); whole(document.getElementById('tintField')); whole(document.getElementById('tintHue')); whole(document.getElementById('tintNow')); }
                return out;
            };
            var last = '';
            var report = function () {
                var now = JSON.stringify(holes());
                if (now === last) return;
                last = now;
                window.parent.postMessage({ tintHoles: JSON.parse(now) }, '*');
            };
            // after anything that can move them, and every frame for a moment after (menus and windows animate)
            var until = 0, running = false;
            var follow = function () {
                until = performance.now() + 500;
                if (running) return;
                running = true;
                var step = function () { report(); if (performance.now() < until) requestAnimationFrame(step); else running = false; };
                requestAnimationFrame(step);
            };
            ['pointerdown', 'pointerup', 'click', 'input', 'keydown', 'keyup', 'wheel', 'resize'].forEach(function (name) {
                window.addEventListener(name, follow, { capture: true, passive: true });
            });
            window.addEventListener('pointermove', function (event) { if (event.buttons) follow(); }, { capture: true, passive: true });
            window.addEventListener('mousemove', function (event) { if (event.buttons) follow(); }, { capture: true, passive: true });
            window.addEventListener('load', follow);
            if (window.ResizeObserver) new ResizeObserver(follow).observe(document.getElementById('canvas-container'));
            follow();
            window.addEventListener('storage', function (event) { if (event.key === 'page-inverted') take(event.newValue === 'yes'); });
        })();
    </script>
