<!doctype html>

<!-- github pages serves files, not routes, so /cards has to be a real
     place on the disk. this is that place, and all it does is hand the
     reader on to the site itself with the section written on the
     ticket — app.html reads it, opens cards, and tidies the address bar
     back to /cards. the root is its own page and is left alone. -->
<meta name="robots" content="noindex">
<link rel="canonical" href="../cards">
<script>location.replace('../app.html?go=cards' + location.hash);</script>
<meta http-equiv="refresh" content="0; url=../app.html?go=cards">
</head>
<body><a href="../app.html?go=cards">cards</a></body>
</html>
