<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>:p</title>
<!-- github pages serves files, not routes, so /cards has to be a real
     place on the disk. this is that place, and all it does is hand the
     reader back to the site with the section written on the ticket —
     index.html reads it, opens cards, and tidies the address bar back to
     /cards. relative, so it works the same served from a folder. -->
<meta name="robots" content="noindex">
<link rel="canonical" href="../cards">
<script>location.replace('../?go=cards' + location.hash);</script>
<meta http-equiv="refresh" content="0; url=../?go=cards">
</head>
<body><a href="../?go=cards">cards</a></body>
</html>
