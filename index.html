<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>:p</title>
<!-- the front door: a tiny dino run in the middle, and the way in -->
<script>
try { if (localStorage.getItem('page-inverted') === 'yes') document.documentElement.classList.add('inverted'); } catch (error) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiko:wght@400&amp;family=VT323&amp;display=swap">
<style>
	:root {
		--paper: #fff;
		--ink: #000;
		--cur-dot: url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='22'%20height='22'%20viewBox='0%200%2026%2026'%3E%3Ccircle%20cx='13'%20cy='13'%20r='5.8'%20fill='%23000'%20stroke='%23fff'%20stroke-width='1.20'/%3E%3C/svg%3E") 11 11, default;
		--cur-tap: url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='22'%20height='22'%20viewBox='0%200%2026%2026'%3E%3Ccircle%20cx='13'%20cy='13'%20r='5.8'%20fill='%23000'%20stroke='%23fff'%20stroke-width='1.20'/%3E%3C/svg%3E") 11 11, pointer;
	}
	html.inverted { --paper: #000; --ink: #fff; }
	html { background: var(--paper); color: var(--ink); cursor: var(--cur-dot); }
	body {
		display: grid;
		place-items: center;
		min-height: 100vh;
		margin: 0;
		font-family: 'Amiko', sans-serif;
		user-select: none;
		-webkit-user-select: none;
	}
	/* the enter pill sits at the exact middle of the screen, the run above it */
	.door {
		position: fixed;
		left: 50%;
		top: 50%;
		display: flex;
		flex-direction: column;
		align-items: center;
		gap: 16px;
		transform: translate(-50%, calc(-100% + 1.2rem));
		animation: door-in 0.6s cubic-bezier(0.22, 1, 0.36, 1) both;
	}
	@keyframes door-in { from { transform: translate(-50%, calc(-100% + 1.2rem + 14px)); } }
	.run { position: relative; }
	canvas { display: block; cursor: var(--cur-tap); touch-action: manipulation; }
	.score { position: absolute; top: 0; right: 0; font-family: 'VT323', monospace; font-size: 1.3rem; line-height: 1; }
	/* keeps its height empty, so nothing jumps; sits nearer the run than the pill */
	.hint { min-height: 1.4em; margin: -6px 0 14px; font-size: 0.8rem; line-height: 1.4; }
	/* the link itself never moves: it is the steady thing the pointer is over, a few pixels bigger
	   than the pill all round, so the pill can rise and wobble without slipping out from under it */
	.enter {
		display: block;
		padding: 6px;
		margin: -6px;
		color: inherit;
		text-decoration: none;
		cursor: var(--cur-tap);
		-webkit-tap-highlight-color: transparent;
	}
	.enter:focus { outline: none; }
	.enter:focus-visible .enter-pill { outline: 1px dashed var(--ink); outline-offset: 3px; }
	/* black with white words; on hover the white grows out from the pointer — drawn as a difference
	   layer, so the words flip with it and nothing is ever grey */
	.enter-pill {
		position: relative;
		display: grid;
		place-items: center;
		height: 2.4rem;
		padding: 0.18em 1.8rem 0;
		overflow: hidden;
		color: var(--paper);
		background: var(--ink);
		border: 1px solid var(--ink);
		border-radius: 999px;
		font-size: 0.95rem;
		isolation: isolate;
		will-change: transform, rotate, translate;
		backface-visibility: hidden;
		transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1);
	}
	/* the white is a circle placed exactly where the pointer came in, then grown from that point;
	   placed first and grown after, so it can never start from anywhere else */
	.enter-ink {
		position: absolute;
		left: 0;
		top: 0;
		width: 0;
		height: 0;
		background: #fff;
		border-radius: 50%;
		mix-blend-mode: difference;
		transform: scale(0);
		transition: transform 0.55s cubic-bezier(0.33, 0.9, 0.4, 1);
		pointer-events: none;
	}
	.enter.is-lit .enter-ink { transform: scale(1); }
	/* hover: it rises with a small wobble (and the white grows inside); the press gets the full wiggle */
	.enter:hover .enter-pill { transform: translateY(-3px); animation: enter-shake 0.55s cubic-bezier(0.37, 0, 0.63, 1); }
	/* a small natural wobble — a hair of tilt with a little drift, settling out; kept on its own
	   layer so the 1px outline turns as one picture instead of breaking up */
	@keyframes enter-shake {
		0%   { rotate: 0deg;    translate: 0 0; }
		20%  { rotate: -0.9deg; translate: -1px 0; }
		45%  { rotate: 0.7deg;  translate: 1px 0; }
		70%  { rotate: -0.35deg; translate: -0.5px 0; }
		100% { rotate: 0deg;    translate: 0 0; }
	}
	.enter:active .enter-pill { transform: translateY(-1px); animation: enter-wiggle 0.5s cubic-bezier(0.37, 0, 0.63, 1); }
	@keyframes enter-wiggle {
		0%   { rotate: 0deg; }
		25%  { rotate: -3deg; }
		50%  { rotate: 3deg; }
		75%  { rotate: -1.5deg; }
		100% { rotate: 0deg; }
	}
</style>
</head>
<body>
<main class="door">
	<div class="run">
		<canvas id="run" aria-label="dino run"></canvas>
		<span class="score" id="score">0</span>
	</div>
	<p class="hint" id="hint"></p>
	<a class="enter" href="home/"><span class="enter-pill">enter<span class="enter-ink" aria-hidden="true"></span></span></a>
</main>
<script>
(function () {
    const canvas = document.getElementById('run');
    const pen = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const hintEl = document.getElementById('hint');
    const W = 480, H = 120, GROUND = 100, P = 3;   // css size, ground line, one art pixel
    const dpr = Math.max(1, Math.round(window.devicePixelRatio || 1));
    canvas.width = W * dpr; canvas.height = H * dpr;
    canvas.style.width = `${W}px`; canvas.style.height = `${H}px`;
    pen.scale(dpr, dpr);

    // 1-bit art, one character per art pixel
    const DINO = [
        '....####', '...##.##', '...#####', '...###..', '#..#####', '#.####..',
        '######..', '.#####..', '..##.#..', '..#..#..'
    ];
    const DINO_STEP = ['..##.#..', '..#...#.'];
    const CACTI = [
        ['.#.', '.##', '##.', '.#.', '.#.', '.#.'],
        ['.#..#.', '.##.#.', '##.###', '.#..#.', '.#..#.', '.#..#.']
    ];

    let ink = '#000', paper = '#fff';
    let dino, cacti, speed, score, best, state, last, nextGap, legs;

    function colours() {
        const css = getComputedStyle(document.documentElement);
        ink = css.getPropertyValue('--ink').trim() || '#000';
        paper = css.getPropertyValue('--paper').trim() || '#fff';
    }

    function sprite(rows, x, y) {
        pen.fillStyle = ink;
        rows.forEach((row, r) => {
            for (let c = 0; c < row.length; c += 1) {
                if (row[c] === '#') pen.fillRect(Math.round(x) + c * P, Math.round(y) + r * P, P, P);
            }
        });
    }

    function reset() {
        dino = { y: 0, v: 0 };
        cacti = [];
        speed = 4;
        score = 0;
        legs = 0;
        nextGap = 60;
        state = 'ready';
        try { best = Number(localStorage.getItem('front-dino')) || 0; } catch (error) { best = 0; }
        scoreEl.textContent = best ? `hi ${best}` : '0';
        draw();
    }

    let overAt = 0;
    function jump() {
        if (state === 'over') {
            if (performance.now() - overAt < 350) return;   // no instant restart off the crash
            reset();                                          // and one press both resets and runs
        }
        if (state === 'ready') { state = 'run'; hintEl.textContent = ''; last = performance.now(); requestAnimationFrame(tick); }
        if (dino.y === 0) dino.v = 9.5;
    }

    function tick(now) {
        if (state !== 'run') return;
        const s = Math.max(0, Math.min((now - last) / 16.7, 3));   // a frame can stamp itself before the press
        last = now;

        dino.v -= 0.6 * s;
        dino.y = Math.max(0, dino.y + dino.v * s);
        if (dino.y === 0) dino.v = 0;

        cacti.forEach((one) => { one.x -= speed * s; });
        cacti = cacti.filter((one) => one.x > -30);
        nextGap -= speed * s;
        if (nextGap <= 0) {
            cacti.push({ x: W + 10, art: CACTI[Math.random() < 0.7 ? 0 : 1] });
            nextGap = 160 + Math.random() * 180 + speed * 12;
        }

        score += 0.1 * s;
        speed = 4 + Math.min(score / 100, 5);
        legs += s;
        scoreEl.textContent = `${best ? `hi ${best} · ` : ''}${Math.floor(score)}`;

        // a little inside each box, so a near miss is a miss
        const dx = 30, dw = 8 * P - 6, dh = DINO.length * P - 4, dy = GROUND - dino.y - dh;
        const hit = cacti.some((one) => {
            const cw = one.art[0].length * P - 4, ch = one.art.length * P - 2;
            return one.x + 2 < dx + dw && one.x + 2 + cw > dx && GROUND - ch < dy + dh;
        });
        draw();
        if (hit) return over();
        requestAnimationFrame(tick);
    }

    function over() {
        state = 'over';
        overAt = performance.now();
        const got = Math.floor(score);
        if (got > best) { best = got; try { localStorage.setItem('front-dino', String(best)); } catch (error) {} }
        scoreEl.textContent = `hi ${best} · ${got}`;
        hintEl.textContent = 'died';
    }

    function draw() {
        pen.fillStyle = paper;
        pen.fillRect(0, 0, W, H);
        pen.fillStyle = ink;
        pen.fillRect(0, GROUND, W, 1);
        const rows = DINO.slice(0, -2).concat(dino.y > 0 || state !== 'run'
            ? DINO.slice(-2) : [DINO_STEP[Math.floor(legs / 6) % 2], DINO.at(-1)]);
        sprite(rows, 30, GROUND - dino.y - DINO.length * P);
        cacti.forEach((one) => sprite(one.art, one.x, GROUND - one.art.length * P));
    }

    window.addEventListener('keydown', (event) => {
        if (event.code !== 'Space' && event.code !== 'ArrowUp') return;
        if (event.repeat) { event.preventDefault(); return; }    // a held key is one jump, not a restart
        if (document.activeElement && document.activeElement.classList.contains('enter')) return;
        event.preventDefault();
        jump();
    });
    canvas.addEventListener('pointerdown', (event) => { event.preventDefault(); jump(); });

    // the white on the enter pill spreads from where the pointer crossed into it
    const enter = document.querySelector('.enter');
    const pill = enter.querySelector('.enter-pill');
    const blot = enter.querySelector('.enter-ink');
    const light = (event) => {
        if (enter.classList.contains('is-lit')) return;
        const box = pill.getBoundingClientRect();
        blot.style.transition = 'none';                       // jump there while still a dot
        const x = event.clientX - box.left;
        const y = event.clientY - box.top;
        // just big enough to reach the far corner from here, so the spread is seen the whole way
        const reach = Math.ceil(Math.hypot(Math.max(x, box.width - x), Math.max(y, box.height - y))) + 2;
        blot.style.left = `${x - reach}px`;
        blot.style.top = `${y - reach}px`;
        blot.style.width = blot.style.height = `${reach * 2}px`;
        void blot.offsetWidth;
        blot.style.transition = '';
        enter.classList.add('is-lit');
    };
    const dim = () => enter.classList.remove('is-lit');
    // whichever arrives first — some browsers skip the enter event, but never the first move
    ['pointerenter', 'mouseenter', 'pointermove', 'mousemove'].forEach((name) => enter.addEventListener(name, light));
    ['pointerleave', 'mouseleave'].forEach((name) => enter.addEventListener(name, dim));

    colours();
    reset();
}());
</script>
</body>
</html>
