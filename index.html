<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>:p</title>
<!-- the front door: a tiny dino run in the middle, and the way in -->
<script>
try { if (localStorage.getItem('page-inverted') === 'yes') document.documentElement.classList.add('inverted'); } catch (error) {}
// framed under the home board: the run alone, no way in (you're already in)
if (/[?&]embed\b/.test(location.search)) document.documentElement.classList.add('embedded');
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiko:wght@400&amp;family=Bitcount+Prop+Double:wght@400&amp;family=VT323&amp;display=swap">
<style>
	:root {
		--paper: #fff;
		--ink: #000;
		--cur-dot: url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='22'%20height='22'%20viewBox='0%200%2026%2026'%3E%3Ccircle%20cx='13'%20cy='13'%20r='5.8'%20fill='%23000'%20stroke='%23fff'%20stroke-width='1.20'/%3E%3C/svg%3E") 11 11, default;
		--cur-tap: url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='22'%20height='22'%20viewBox='0%200%2026%2026'%3E%3Ccircle%20cx='13'%20cy='13'%20r='5.8'%20fill='%23000'%20stroke='%23fff'%20stroke-width='1.20'/%3E%3C/svg%3E") 11 11, pointer;
	}
	html.inverted { --paper: #000; --ink: #fff; }
	html { background: var(--paper); color: var(--ink); cursor: var(--cur-dot); }
	body {
		display: grid;
		place-items: center;
		min-height: 100vh;
		margin: 0;
		font-family: 'Amiko', sans-serif;
		user-select: none;
		-webkit-user-select: none;
	}
	/* the enter pill sits at the exact middle of the screen, the run above it */
	.door {
		position: fixed;
		left: 50%;
		top: 50%;
		display: flex;
		flex-direction: column;
		align-items: center;
		gap: 16px;
		transform: translate(-50%, calc(-100% + 1.2rem)) scale(var(--fit, 1));
		transform-origin: 50% calc(100% - 1.2rem);   /* the pill's middle stays the screen's middle */
	}
	html.embedded .enter, html.embedded .seek { display: none; }
	/* the search, a smaller copy of the one on home */
	.seek { position: relative; width: 24rem; margin: 0 0 22px; }   /* halfway between the ground and the pill */
	.seek input {
		width: 100%;
		height: 42px;                /* the site's --field, the height of every box you type in */
		box-sizing: border-box;
		padding: 0 3rem 0 2.6rem;
		color: var(--ink);
		background: var(--paper);
		border: 1px solid var(--ink);
		border-radius: 999px;
		font: inherit;
		outline: none;
		cursor: text;
		-webkit-appearance: none;
		appearance: none;
	}
	.seek input::-webkit-search-cancel-button { display: none; }
	.seek input::placeholder { color: #8a8a8a; opacity: 1; }   /* the site's --muted, placeholders only */
	.seek-mark { position: absolute; left: 0.95rem; top: 50%; width: 1.05rem; height: 1.05rem; transform: translateY(-50%); pointer-events: none; }
	/* just the arrow: no circle round it; on hover it only nudges right a hair */
	.seek-go {
		position: absolute;
		right: 10px;
		top: 50%;
		display: grid;
		place-items: center;
		width: 28px;
		height: 28px;
		padding: 0;
		color: var(--ink);
		background: none;
		border: 0;
		cursor: var(--cur-tap);
		transform: translateY(-50%);
		transition: transform 0.2s ease;
	}
	.seek-go:hover { transform: translate(2px, -50%); }
	.seek-go svg { width: 70%; height: 70%; }
	/* results the way chrome lists them: the bar opens downward into one box, the rows are plain,
	   and a row only shows its edge under the pointer */
	.seek.is-open input { border-radius: 21px 21px 0 0; border-bottom-color: transparent; }
	.seek-found {
		position: absolute;
		top: 41px;
		left: 0;
		right: 0;
		z-index: 5;
		margin: 0;
		padding: 0 6px 8px;
		list-style: none;
		background: var(--paper);
		border: 1px solid var(--ink);
		border-top: 0;
		border-radius: 0 0 21px 21px;
		text-align: left;
	}
	.seek-found[hidden] { display: none; }
	.seek-found::before { content: ''; display: block; height: 1px; margin: 0 10px 6px; background: var(--ink); }
	.seek-hit {
		display: grid;
		grid-template-columns: 1.1rem minmax(0, 1fr) auto;
		align-items: center;
		gap: 0.7rem;
		padding: 0.45rem 0.7rem;
		color: var(--ink);
		border: 1px solid transparent;
		border-radius: 14px;
		text-decoration: none;
		cursor: var(--cur-tap);
	}
	.seek-hit:hover, .seek-hit.is-on { border-color: var(--ink); }
	.seek-hit svg { width: 0.95rem; height: 0.95rem; }
	.seek-hit-words { display: flex; flex-direction: column; min-width: 0; }
	.seek-hit-words b { font-weight: 400; font-size: 0.9rem; }
	.seek-hit-words span { overflow: hidden; font-size: 0.78rem; white-space: nowrap; text-overflow: ellipsis; }
	.seek-hit small { font-family: 'VT323', monospace; font-size: 1rem; }
	.seek-hit mark { color: var(--paper); background: var(--ink); border-radius: 3px; padding: 0 2px; }
	.seek-none { padding: 0.5rem 0.8rem; font-size: 0.82rem; }
	/* framed, what shows — the score down to the ground line, 36px over the run to 100px into it — is
	   centred in the frame: its middle is 32px below the run's top, so that point goes to the middle */
	html.embedded .door { transform: translate(-50%, calc(-32px * var(--fit, 1))) scale(var(--fit, 1)); transform-origin: 50% 0; }
	html.embedded .hint { margin-top: -32px; }   /* just under the ground, inside the frame */
	html.embedded, html.embedded body { min-height: 0; overflow: hidden; }
	/* the words over the run, under the best score; press them (or jump) to begin. Nothing on this
	   page moves on its own but the enter pill: they are simply there, or not */
	.start {
		position: absolute;
		top: 6px;
		left: 50%;
		z-index: 1;
		margin: 0;
		padding: 0;
		color: var(--ink);
		background: none;
		border: 0;
		font-family: 'Bitcount Prop Double', 'Courier New', monospace;
		font-size: 2.1rem;
		line-height: 1;
		white-space: nowrap;
		cursor: var(--cur-tap);
		transform: translateX(-50%);
		animation: start-bob 2.4s steps(1, end) infinite;
	}
	/* an 8-bit float: it sits on whole-pixel steps and jumps between them, never glides */
	@keyframes start-bob {
		0%   { translate: 0 0; }
		50%  { translate: 0 -3px; }
		100% { translate: 0 0; }
	}
	.start:focus { outline: none; }
	.start.is-gone { visibility: hidden; }
	.run { position: relative; }
	canvas { display: block; cursor: var(--cur-tap); touch-action: manipulation; }
	/* the score never moves and never goes: top centre, over the words, best then this run */
	.score { position: absolute; top: -36px; left: 50%; transform: translateX(-50%); white-space: nowrap; font-family: 'VT323', monospace; font-size: 1.3rem; line-height: 1; }
	/* keeps its height empty, so nothing jumps; its middle is exactly halfway between the ground
	   line and the pill — the ground is 19px above the canvas foot, so the bottom margin is the
	   top one plus those 19px */
	.hint { position: relative; z-index: 1; min-height: 1.4em; margin: -25px 0 -6px; font-size: 0.8rem; line-height: 1.4; }
	/* the link itself never moves: it is the steady thing the pointer is over, a few pixels bigger
	   than the pill all round, so the pill can rise and wobble without slipping out from under it */
	.enter {
		display: block;
		padding: 6px;
		margin: -6px;
		color: inherit;
		text-decoration: none;
		cursor: var(--cur-tap);
		-webkit-tap-highlight-color: transparent;
	}
	.enter:focus { outline: none; }
	.enter:focus-visible .enter-pill { outline: 1px dashed var(--ink); outline-offset: 3px; }
	/* black with white words; on hover the white grows out from the pointer — drawn as a difference
	   layer, so the words flip with it and nothing is ever grey */
	.enter-pill {
		position: relative;
		display: grid;
		place-items: center;
		height: 2.4rem;
		padding: 0.18em 1.8rem 0;
		color: var(--paper);
		background: var(--ink);
		border: 1px solid var(--ink);
		border-radius: 999px;
		font-size: 0.95rem;
		will-change: transform, rotate, translate;
		backface-visibility: hidden;
		transition: transform 0.45s cubic-bezier(0.25, 0.8, 0.35, 1);
	}
	/* the white is a second, white copy of the pill lying exactly over the black one, uncovered by a
	   circle that grows from where the pointer came in. Cut out with clip-path rather than a blended
	   circle in a clipped box: that left a hairline of black along the rounded edge as it moved */
	.enter-ink {
		position: absolute;
		inset: -1px;
		display: grid;
		place-items: center;
		padding: 0.18em 1.8rem 0;
		color: var(--ink);
		background: var(--paper);
		border: 1px solid var(--ink);
		border-radius: 999px;
		box-sizing: border-box;
		clip-path: circle(0px at var(--at-x, 50%) var(--at-y, 50%));
		transition: clip-path 0.85s cubic-bezier(0.3, 0.7, 0.35, 1);
		pointer-events: none;
	}
	.enter.is-lit .enter-ink { clip-path: circle(var(--reach, 120px) at var(--at-x, 50%) var(--at-y, 50%)); }
	/* hover only rises; the wobble and the press wiggle are played by the script, so each runs to
	   its end — as css animations a release restarted the hover one, and leaving cut the tilt off */
	.enter:hover .enter-pill { transform: translateY(-3px); }
	.enter:active .enter-pill { transform: translateY(-1px); }
</style>
</head>
<body>
<main class="door">
	<div class="run">
		<button class="start" id="start" type="button">start to start</button>
		<canvas id="run" aria-label="dino run"></canvas>
		<span class="score" id="score">hi 0000 · 0000</span>
	</div>
	<p class="hint" id="hint"></p>
	<!-- the site's search, here: it reads the pages itself and lists them as you type -->
	<form class="seek" id="seek" action="home/" method="get" role="search" autocomplete="off">
		<svg class="seek-mark" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5"/></svg>
		<input name="find" type="search" placeholder="search page..." aria-label="search page" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
		<ol class="seek-found" id="seekFound" hidden></ol>
		<button class="seek-go" type="submit" aria-label="go"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
	</form>
	<a class="enter" href="home/" aria-label="enter"><span class="enter-pill">^_^<span class="enter-ink" aria-hidden="true">o_o</span></span></a>
</main>
<script>
(function () {
    const canvas = document.getElementById('run');
    const pen = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const hintEl = document.getElementById('hint');
    const startEl = document.getElementById('start');
    const H = 120, GROUND = 100, P = 3;   // css height, ground line, one art pixel
    // framed on home, the ground runs the whole width of the frame (the search bar's length);
    // on the front door it is 480 wide
    const FRAMED = document.documentElement.classList.contains('embedded');
    let W = 480;
    const dpr = Math.max(1, Math.round(window.devicePixelRatio || 1));
    function sizeCanvas() {
        W = FRAMED ? Math.max(320, Math.floor(window.innerWidth)) : 480;
        canvas.width = W * dpr; canvas.height = H * dpr;
        canvas.style.width = `${W}px`; canvas.style.height = `${H}px`;
        pen.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    sizeCanvas();
    // framed, the dino starts at the left and runs on until FOLLOW_AT before the view keeps up with it
    const START_X = 30;
    const followAt = () => (FRAMED ? Math.max(START_X, Math.round(W * 0.28)) : START_X);
    let dinoX = START_X;

    // 1-bit art, one character per art pixel
    const DINO = [
        '....####', '...##.##', '...#####', '...###..', '#..#####', '#.####..',
        '######..', '.#####..', '..##.#..', '..#..#..'
    ];
    const DINO_STEP = ['..##.#..', '..#...#.'];
    const CACTI = [
        ['.#.', '.##', '##.', '.#.', '.#.', '.#.'],
        ['.#..#.', '.##.#.', '##.###', '.#..#.', '.#..#.', '.#..#.']
    ];

    let ink = '#000', paper = '#fff';
    let dino, cacti, speed, score, best, state, last, nextGap, legs;

    function colours() {
        const css = getComputedStyle(document.documentElement);
        ink = css.getPropertyValue('--ink').trim() || '#000';
        paper = css.getPropertyValue('--paper').trim() || '#fff';
    }

    function sprite(rows, x, y) {
        pen.fillStyle = ink;
        rows.forEach((row, r) => {
            for (let c = 0; c < row.length; c += 1) {
                if (row[c] === '#') pen.fillRect(Math.round(x) + c * P, Math.round(y) + r * P, P, P);
            }
        });
    }

    function reset() {
        dino = { y: 0, v: 0 };
        dinoX = START_X;
        cacti = [];
        speed = 4;
        score = 0;
        legs = 0;
        nextGap = 60;
        state = 'ready';
        try { best = Number(localStorage.getItem('front-dino')) || 0; } catch (error) { best = 0; }
        showScore(0);
        draw();
    }

    const MAX = 9999;
    const four = (n) => String(Math.min(MAX, Math.floor(n))).padStart(4, '0');
    let shown = 0;
    const showScore = (got) => { shown = got; scoreEl.textContent = `hi ${four(best)} · ${four(got)}`; };
    // the best is kept the moment it is beaten, not only at the crash, so a refresh mid-run keeps it
    const keepBest = (got) => {
        if (got <= best) return;
        best = got;
        try { localStorage.setItem('front-dino', String(best)); } catch (error) {}
    };
    // the front door and the run under the home board share one best: whichever beats it, both show it
    window.addEventListener('storage', (event) => {
        if (event.key !== 'front-dino') return;
        best = Math.max(best, Number(event.newValue) || 0);
        showScore(shown);
    });

    let overAt = 0;
    function jump() {
        if (state === 'over') {
            if (performance.now() - overAt < 350) return;   // no instant restart off the crash
            reset();                                          // and one press both resets and runs
        }
        if (state === 'ready') {
            state = 'run';
            hintEl.textContent = '';
            startEl.classList.add('is-gone');   // gone for good: it only comes back on a refresh
            last = performance.now(); requestAnimationFrame(tick);
        }
        if (dino.y === 0) dino.v = 9.5;
    }

    function tick(now) {
        if (state !== 'run') return;
        const s = Math.max(0, Math.min((now - last) / 16.7, 3));   // a frame can stamp itself before the press
        last = now;

        dino.v -= 0.6 * s;
        dino.y = Math.max(0, dino.y + dino.v * s);
        if (dino.y === 0) dino.v = 0;

        // until it reaches its spot the dino does the running and the world holds still; after, the
        // world moves past it
        if (dinoX < followAt()) dinoX = Math.min(followAt(), dinoX + speed * s);
        else cacti.forEach((one) => { one.x -= speed * s; });
        cacti = cacti.filter((one) => one.x > -30);
        nextGap -= speed * s;
        if (nextGap <= 0) {
            cacti.push({ x: W + 10, art: CACTI[Math.random() < 0.7 ? 0 : 1] });
            nextGap = 160 + Math.random() * 180 + speed * 12;
        }

        score = Math.min(MAX, score + 0.1 * s);
        speed = 4 + Math.min(score / 100, 5);
        legs += s;
        keepBest(Math.floor(score));
        showScore(score);

        // a little inside each box, so a near miss is a miss
        const dx = dinoX, dw = 8 * P - 6, dh = DINO.length * P - 4, dy = GROUND - dino.y - dh;
        const hit = cacti.some((one) => {
            const cw = one.art[0].length * P - 4, ch = one.art.length * P - 2;
            return one.x + 2 < dx + dw && one.x + 2 + cw > dx && GROUND - ch < dy + dh;
        });
        draw();
        if (hit) return over(false);
        if (score >= MAX) return over(true);              // the top of the board: that's the end
        requestAnimationFrame(tick);
    }

    function over(passed) {
        state = 'over';
        overAt = performance.now();
        const got = Math.floor(score);
        keepBest(got);
        showScore(got);
        hintEl.textContent = passed ? 'u have passd' : 'died';
    }

    function draw() {
        pen.fillStyle = paper;
        pen.fillRect(0, 0, W, H);
        pen.fillStyle = ink;
        pen.fillRect(0, GROUND, W, 1);
        const rows = DINO.slice(0, -2).concat(dino.y > 0 || state !== 'run'
            ? DINO.slice(-2) : [DINO_STEP[Math.floor(legs / 6) % 2], DINO.at(-1)]);
        sprite(rows, dinoX, GROUND - dino.y - DINO.length * P);
        cacti.forEach((one) => sprite(one.art, one.x, GROUND - one.art.length * P));
    }

    window.addEventListener('keydown', (event) => {
        if (event.code !== 'Space' && event.code !== 'ArrowUp') return;
        if (event.repeat) { event.preventDefault(); return; }    // a held key is one jump, not a restart
        if (document.activeElement && (document.activeElement.classList.contains('enter') || document.activeElement.matches('input'))) return;
        event.preventDefault();
        jump();
    });
    canvas.addEventListener('pointerdown', (event) => { event.preventDefault(); jump(); });
    startEl.addEventListener('pointerdown', (event) => { event.preventDefault(); jump(); });

    // the white on the enter pill spreads from where the pointer crossed into it
    const enter = document.querySelector('.enter');
    const pill = enter.querySelector('.enter-pill');
    const blot = enter.querySelector('.enter-ink');
    const light = (event) => {
        if (enter.classList.contains('is-lit')) return;
        const box = pill.getBoundingClientRect();
        blot.style.transition = 'none';                       // jump there while still a dot
        const x = (event.clientX - box.left) / fit;
        const y = (event.clientY - box.top) / fit;
        // just big enough to reach the far corner from here, so the spread is seen the whole way
        const reach = Math.ceil(Math.hypot(Math.max(x, box.width / fit - x), Math.max(y, box.height / fit - y))) + 2;
        blot.style.setProperty('--at-x', `${x}px`);
        blot.style.setProperty('--at-y', `${y}px`);
        blot.style.setProperty('--reach', `${reach}px`);
        void blot.offsetWidth;
        blot.style.transition = '';
        enter.classList.add('is-lit');
    };
    const dim = () => enter.classList.remove('is-lit');

    // a small natural wobble on the way in, the full wiggle on a press; a new one replaces the last
    // the pill is kept on its own layer so the 1px outline turns whole
    let moving = null;
    const play = (frames, duration) => {
        if (moving) moving.cancel();
        moving = pill.animate(frames, { duration, easing: 'cubic-bezier(0.45, 0, 0.55, 1)' });
    };
    const wobble = () => play([
        { rotate: '0deg', translate: '0 0' },
        { rotate: '-0.9deg', translate: '-1px 0', offset: 0.2 },
        { rotate: '0.7deg', translate: '1px 0', offset: 0.45 },
        { rotate: '-0.35deg', translate: '-0.5px 0', offset: 0.7 },
        { rotate: '0deg', translate: '0 0' }
    ], 900);
    const wiggle = () => play([
        { rotate: '0deg' }, { rotate: '-3deg' }, { rotate: '3deg' }, { rotate: '-1.5deg' }, { rotate: '0deg' }
    ], 800);
    enter.addEventListener('pointerenter', (event) => { if (event.pointerType !== 'touch') wobble(); });
    enter.addEventListener('pointerdown', wiggle);
    // whichever arrives first — some browsers skip the enter event, but never the first move
    ['pointerenter', 'mouseenter', 'pointermove', 'mousemove'].forEach((name) => enter.addEventListener(name, light));
    ['pointerleave', 'mouseleave'].forEach((name) => enter.addEventListener(name, dim));

    // a narrow or short screen gets the same page, shrunk to fit — nothing re-arranges
    const door = document.querySelector('.door');
    let fit = 1;
    const fitDoor = () => {
        const framed = document.documentElement.classList.contains('embedded');
        const above = framed ? 92 : door.offsetHeight - pill.offsetHeight / 2 + 40;   // the score sits 36px over the run; framed, 'died' reaches 92px below the middle
        fit = Math.min(1, framed ? Infinity : (window.innerWidth - 32) / door.offsetWidth, (window.innerHeight / 2 - (framed ? 4 : 16)) / above);
        document.documentElement.style.setProperty('--fit', fit);
    };
    window.addEventListener('resize', () => { if (FRAMED) { sizeCanvas(); draw(); } fitDoor(); });
    fitDoor();

    // the search: it reads the site's own pages (app.html) once, then lists matches as you type —
    // a page by its name, or any word on it — and a result goes straight to that page
    const seek = document.getElementById('seek');
    const seekField = seek.querySelector('input');
    const seekFound = document.getElementById('seekFound');
    const PAGES = [
        { id: 'home', roots: ['homePanel'] },
        { id: 'cards', roots: ['homeBody', 'makerScreen', 'studyScreen'] },
        { id: 'audio', roots: ['audioPanel'] },
        { id: 'chat', roots: ['chatPanel'] }
    ];
    let pageWords = null;
    let seekHits = [];
    let seekOn = 0;
    const readPages = () => pageWords || (pageWords = fetch('app.html').then((got) => got.text()).then((html) => {
        const doc = new DOMParser().parseFromString(html, 'text/html');
        return PAGES.map((page) => {
            const words = [];
            const note = doc.querySelector(`.help-note[data-section="${page.id}"]`);
            if (note) words.push(note.textContent.trim());
            page.roots.map((id) => doc.getElementById(id)).filter(Boolean).forEach((root) => {
                root.querySelectorAll('script, style, svg, iframe, canvas, .page-search').forEach((gone) => gone.remove());
                const walk = doc.createTreeWalker(root, NodeFilter.SHOW_TEXT);
                while (walk.nextNode()) { const said = walk.currentNode.textContent.trim(); if (said) words.push(said); }
                root.querySelectorAll('[placeholder], [title], button[aria-label]').forEach((el) => {
                    ['placeholder', 'title', 'aria-label'].forEach((name) => { const said = (el.getAttribute(name) || '').trim(); if (said) words.push(said); });
                });
            });
            return { id: page.id, words };
        });
    }).catch(() => { pageWords = null; return []; }));
    const PAGE_MARK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h8l4 4v14H6z M14 3v4h4"/></svg>';
    const snippet = (text, query) => {
        const at = text.toLowerCase().indexOf(query);
        const from = Math.max(0, at - 24);
        const piece = text.slice(from, at + query.length + 40);
        const holder = document.createElement('span');
        holder.append((from > 0 ? '…' : '') + piece.slice(0, at - from));
        const mark = document.createElement('mark');
        mark.textContent = piece.slice(at - from, at - from + query.length);
        holder.append(mark, piece.slice(at - from + query.length));
        return holder;
    };
    const shut = () => { seekFound.hidden = true; seek.classList.remove('is-open'); };
    const showOn = () => seekFound.querySelectorAll('.seek-hit').forEach((row, at) => row.classList.toggle('is-on', at === seekOn));
    const findNow = async () => {
        const query = seekField.value.trim().toLowerCase();
        if (!query) { shut(); return; }
        const pages = await readPages();
        if (seekField.value.trim().toLowerCase() !== query) return;   // typed on since
        seekHits = pages.map((page) => ({ id: page.id, named: page.id.includes(query), words: page.words.filter((one) => one.toLowerCase().includes(query)) }))
            .filter((hit) => hit.named || hit.words.length)
            .sort((a, b) => (b.named - a.named) || (b.words.length - a.words.length));
        seekOn = -1;                     // nothing outlined until the pointer or the arrows pick one
        seekFound.innerHTML = '';
        seekHits.forEach((hit) => {
            const row = document.createElement('li');
            const link = document.createElement('a');
            link.className = 'seek-hit';
            link.href = `${hit.id}/?spot=${encodeURIComponent(query)}`;
            link.innerHTML = PAGE_MARK;
            const words = document.createElement('span');
            words.className = 'seek-hit-words';
            const name = document.createElement('b');
            name.textContent = hit.id;
            words.append(name, hit.words.length ? snippet(hit.words[0], query) : Object.assign(document.createElement('span'), { textContent: 'the page itself' }));
            const count = document.createElement('small');
            count.textContent = hit.words.length ? String(hit.words.length) : '';
            link.append(words, count);
            row.append(link);
            seekFound.append(row);
        });
        if (!seekHits.length) {
            const none = document.createElement('li');
            none.className = 'seek-none';
            none.textContent = 'nothing on any page says that';
            seekFound.append(none);
        }
        showOn();
        seekFound.hidden = false;
        seek.classList.add('is-open');
    };
    seekField.addEventListener('input', findNow);
    seekField.addEventListener('focus', () => { readPages(); if (seekField.value.trim()) findNow(); });
    seekField.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') { seekField.value = ''; shut(); seekField.blur(); }
        if ((event.key === 'ArrowDown' || event.key === 'ArrowUp') && seekHits.length) {
            event.preventDefault();
            seekOn = seekOn < 0 ? (event.key === 'ArrowDown' ? 0 : seekHits.length - 1)
                : (seekOn + (event.key === 'ArrowDown' ? 1 : -1) + seekHits.length) % seekHits.length;
            showOn();
        }
        if (event.key === ' ') event.stopPropagation();   // a space typed here is a space, not a jump
    });
    seek.addEventListener('submit', (event) => {
        event.preventDefault();
        const row = seekFound.querySelectorAll('.seek-hit')[Math.max(0, seekOn)];
        if (row) window.location.href = row.href;
        else if (seekField.value.trim()) findNow();
        else seekField.focus();
    });
    document.addEventListener('pointerdown', (event) => { if (!seek.contains(event.target)) shut(); });

    colours();
    reset();

    // framed, it follows the page's lights as they change
    if (document.documentElement.classList.contains('embedded')) {
        try {
            const host = window.parent.document.documentElement;
            const follow = () => {
                document.documentElement.classList.toggle('inverted', host.classList.contains('inverted'));
                colours();
                draw();
            };
            new MutationObserver(follow).observe(host, { attributes: true, attributeFilter: ['class'] });
            follow();
        } catch (error) { /* not ours to read; it keeps the light it started with */ }
    }
}());
</script>
</body>
</html>
