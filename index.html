<head>
<meta charset="utf-8">

<!-- the front door, and nothing in it yet. the pages themselves are
     /home, /cards, /audio, /player and /chat; this is its own page and
     is meant to stay that way.

     it carries the theme and nothing else: arriving here with the
     lights off, a white sheet would be the one thing on this site that
     didn't know. -->
<script>
(function () {
    try {
        if (localStorage.getItem('page-inverted') === 'yes') {
            document.documentElement.classList.add('inverted');
        }
    } catch (error) { /* no storage; the light is the default anyway */ }
}());
</script>

<style>
	html { background: #fff; }
	html.inverted { background: #000; }
	body { margin: 0; min-height: 100vh; }
</style>
</head>
