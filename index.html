<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>:p</title>

<!-- the front door: blank, carrying only the light/dark setting -->
<script>
(function () {
    try {
        if (localStorage.getItem('page-inverted') === 'yes') {
            document.documentElement.classList.add('inverted');
        }
    } catch (error) { /* no storage; the light is the default anyway */ }
}());
</script>

<style>
	html { background: #fff; }
	html.inverted { background: #000; }
	body { margin: 0; min-height: 100vh; }
</style>
</head>
<body></body>
</html>
