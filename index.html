<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>:p</title>

<!-- the front door. the pages themselves are /home, /cards, /audio,
     /player and /chat; this is its own page and is meant to stay that
     way — a few toys to poke at, and nothing to do with the rest.

     it carries the theme: arriving here with the lights off, a white
     sheet would be the one thing on this site that didn't know.

     **one bit, and only one.** every toy draws on a canvas in whole
     device pixels, so nothing is ever painted half-way into a pixel —
     which is where grey comes from. nothing fades either: a fade is
     grey on its way through. -->
<script>
(function () {
    try {
        if (localStorage.getItem('page-inverted') === 'yes') {
            document.documentElement.classList.add('inverted');
        }
    } catch (error) { /* no storage; the light is the default anyway */ }
}());
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiko:wght@400&amp;family=Bitcount+Prop+Double:wght@400&amp;family=VT323&amp;display=swap">

<!-- held back until the type is there. shown at once, every word came up
     in the browser's fallback and jumped into its own face a beat later,
     which is the flash of odd letters on arriving. a second is the most
     it waits. -->
<script>
(function () {
    var root = document.documentElement;
    root.classList.add('booting');
    var show = function () { root.classList.remove('booting'); };
    setTimeout(show, 1000);
    // asked for by name: nothing is laid out yet, so `fonts.ready`
    // alone would answer at once with nothing loaded
    if (!document.fonts || !document.fonts.load) return show();
    Promise.all(['1em Amiko', '1em "Bitcount Prop Double"', '1em VT323']
        .map(function (face) { return document.fonts.load(face); })).then(show, show);
}());
</script>

<style>
	html.booting body { visibility: hidden; }
	:root {
		--paper: #ffffff;
		--ink: #000;
		/* the same pointer as every other page — copied rather than
		   linked, since style.css would bring the whole app with it */
		--cur-dot: url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='22'%20height='22'%20viewBox='0%200%2026%2026'%3E%3Ccircle%20cx='13'%20cy='13'%20r='5.8'%20fill='%23000'%20stroke='%23fff'%20stroke-width='1.20'/%3E%3C/svg%3E") 11 11, default;
			--cur-tap: url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='22'%20height='22'%20viewBox='0%200%2026%2026'%3E%3Ccircle%20cx='13'%20cy='13'%20r='5.8'%20fill='%23000'%20stroke='%23fff'%20stroke-width='1.20'/%3E%3C/svg%3E") 11 11, pointer;
		--drop: 0.088em;
	}
	html.inverted { --paper: #000; --ink: #ffffff; }

	* { box-sizing: border-box; }
	html { background: var(--paper); color: var(--ink); cursor: var(--cur-dot); }
	body {
		margin: 0;
		height: 100vh;
		overflow: hidden;
		background: var(--paper);
		font-family: 'Amiko', sans-serif;
		user-select: none;
		-webkit-user-select: none;
		touch-action: none;
	}
	button, a, .runner { cursor: var(--cur-tap); }

	#stage { position: fixed; inset: 0; display: block; }

	.top {
		position: fixed;
		top: 0; left: 0; right: 0;
		display: flex;
		align-items: center;
		justify-content: space-between;
		height: 56px;
		padding: 0 16px;
		pointer-events: none;
	}
	.top > * { pointer-events: auto; }
	.mark { font-family: 'Bitcount Prop Double', monospace; font-size: 1.6rem; }
	/* every number is vt323, here as everywhere */
	.score { font-family: 'VT323', monospace; font-size: 1.9rem; }
	.enter {
		color: var(--ink);
		font-size: 0.9rem;
		text-decoration: none;
		border-bottom: 1px solid var(--ink);
	}

	.toys {
		position: fixed;
		left: 50%;
		bottom: 16px;
		display: flex;
		gap: 8px;
		transform: translateX(-50%);
	}
	.toys button {
		height: 2.2rem;
		padding: var(--drop) 1.2rem 0;
		font: inherit;
		font-size: 0.95rem;
		color: var(--ink);
		background: var(--paper);
		border: 1px solid var(--ink);
		border-radius: 999px;
		white-space: nowrap;
	}
	/* live inverts, like everything live on this site */
	.toys button.on { color: var(--paper); background: var(--ink); }

	.hint {
		position: fixed;
		left: 0; right: 0;
		bottom: 64px;
		margin: 0;
		font-size: 0.8rem;
		text-align: center;
		pointer-events: none;
	}
	.say {
		position: fixed;
		top: 50%; left: 50%;
		margin: 0;
		padding: calc(0.5rem + var(--drop)) 1rem calc(0.5rem - var(--drop));
		background: var(--paper);
		border: 1px solid var(--ink);
		border-radius: 999px;
		transform: translate(-50%, -50%);
		pointer-events: none;
		white-space: nowrap;
	}
	.runner {
		position: fixed;
		top: 0; left: 0;
		padding: calc(0.4rem + var(--drop)) 0.7rem calc(0.4rem - var(--drop));
		font-size: 1.1rem;
		white-space: nowrap;
		background: var(--paper);
		border: 1px solid var(--ink);
		border-radius: 999px;
		will-change: transform;
	}
	.runner.caught { color: var(--paper); background: var(--ink); }
	[hidden] { display: none !important; }
</style>
</head>
<body>
<canvas id="stage"></canvas>

<header class="top">
	<span class="mark">:p</span>
	<span class="score" id="score"></span>
	<a class="enter" href="home/" title="the site">enter →</a>
</header>

<p class="say" id="say" hidden></p>
<div class="runner" id="runner" hidden></div>
<p class="hint" id="hint"></p>

<nav class="toys" id="toys">
	<button type="button" data-toy="snake">snake</button>
	<button type="button" data-toy="life">life</button>
	<button type="button" data-toy="chase">chase</button>
	<button type="button" data-toy="draw">draw</button>
</nav>

<script>
(function () {
    const stage = document.getElementById('stage');
    const pen = stage.getContext('2d');
    const scoreEl = document.getElementById('score');
    const hintEl = document.getElementById('hint');
    const sayEl = document.getElementById('say');
    const runner = document.getElementById('runner');
    const toys = document.getElementById('toys');

    let dpr = 1;
    let W = 0;
    let H = 0;
    let ink = '#000';
    let paper = '#fff';
    const TOP = 56;       // the row with the score in it
    const FOOT = 100;     // the hint and the pills, with air over them

    function colours() {
        const css = getComputedStyle(document.documentElement);
        ink = css.getPropertyValue('--ink').trim() || '#000';
        paper = css.getPropertyValue('--paper').trim() || '#fff';
    }

    function size() {
        dpr = Math.max(1, Math.round(window.devicePixelRatio || 1));
        W = Math.floor(window.innerWidth * dpr);
        H = Math.floor(window.innerHeight * dpr);
        stage.width = W;
        stage.height = H;
        stage.style.width = `${W / dpr}px`;
        stage.style.height = `${H / dpr}px`;
        pen.imageSmoothingEnabled = false;
    }

    function wipe() {
        pen.fillStyle = paper;
        pen.fillRect(0, 0, W, H);
    }

    /* a grid of whole-pixel cells in the room between the top row and
       the pills, centred. everything below is in device pixels. */
    function field(cssCell) {
        const cs = Math.max(2, Math.round(cssCell * dpr));
        const top = TOP * dpr;
        const room = H - top - FOOT * dpr;
        const cols = Math.floor((W - 32 * dpr) / cs);
        const rows = Math.max(4, Math.floor(room / cs));
        return {
            cs, cols, rows,
            x: Math.floor((W - cols * cs) / 2),
            y: Math.floor(top + (room - rows * cs) / 2)
        };
    }

    function cellAt(f, event) {
        return {
            c: Math.floor((event.clientX * dpr - f.x) / f.cs),
            r: Math.floor((event.clientY * dpr - f.y) / f.cs)
        };
    }

    // a one-pixel outline, drawn as four filled strips so it lands on
    // whole pixels rather than straddling two
    function outline(x, y, w, h) {
        const t = dpr;
        pen.fillStyle = ink;
        pen.fillRect(x - t, y - t, w + 2 * t, t);
        pen.fillRect(x - t, y + h, w + 2 * t, t);
        pen.fillRect(x - t, y, t, h);
        pen.fillRect(x + w, y, t, h);
    }

    function say(words) {
        sayEl.hidden = !words;
        sayEl.textContent = words || '';
    }

    function best(key, value) {
        try {
            const had = Number(localStorage.getItem(key)) || 0;
            if (value > had) localStorage.setItem(key, String(value));
            return Math.max(had, value);
        } catch (error) {
            return value;
        }
    }

    /* --- snake --- */

    const snake = {
        hint: 'arrows or wasd · swipe on a phone',
        start() {
            const f = this.f = field(16);
            const r = Math.floor(f.rows / 2);
            const c = Math.floor(f.cols / 3);
            this.body = [[c, r], [c - 1, r], [c - 2, r]];
            this.dir = [1, 0];
            this.queue = [];
            this.score = 0;
            this.acc = 0;
            this.alive = true;
            this.waiting = true;
            this.food = this.place();
            say('press an arrow ( •̀ω•́ )');
            this.show();
            this.draw();
        },
        place() {
            for (;;) {
                const spot = [Math.floor(Math.random() * this.f.cols), Math.floor(Math.random() * this.f.rows)];
                if (!this.body.some((p) => p[0] === spot[0] && p[1] === spot[1])) return spot;
            }
        },
        show() {
            scoreEl.textContent = `${this.score} · best ${best('front-snake', this.score)}`;
        },
        turn(dx, dy) {
            if (!this.alive) {
                this.start();
                return;
            }
            const last = this.queue.length ? this.queue[this.queue.length - 1] : this.dir;
            if (last[0] === -dx && last[1] === -dy) return;
            if (last[0] === dx && last[1] === dy) return;
            if (this.queue.length < 3) this.queue.push([dx, dy]);
            if (this.waiting) {
                this.waiting = false;
                say('');
            }
        },
        tick(dt) {
            if (!this.alive || this.waiting) return;
            this.acc += dt;
            const step = Math.max(55, 120 - this.score * 3);
            while (this.acc >= step && this.alive) {
                this.acc -= step;
                this.advance();
            }
        },
        advance() {
            if (this.queue.length) this.dir = this.queue.shift();
            const head = [this.body[0][0] + this.dir[0], this.body[0][1] + this.dir[1]];
            const out = head[0] < 0 || head[1] < 0 || head[0] >= this.f.cols || head[1] >= this.f.rows;
            // the tail moves out of the way this step, so it doesn't count
            const bitten = this.body.slice(0, -1).some((p) => p[0] === head[0] && p[1] === head[1]);
            if (out || bitten) {
                this.alive = false;
                say(`(×_×) ${this.score} — any arrow again`);
                return;
            }
            this.body.unshift(head);
            if (head[0] === this.food[0] && head[1] === this.food[1]) {
                this.score += 1;
                this.food = this.place();
                this.show();
            } else {
                this.body.pop();
            }
            this.draw();
        },
        draw() {
            const f = this.f;
            const gap = dpr;
            wipe();
            outline(f.x, f.y, f.cols * f.cs, f.rows * f.cs);
            pen.fillStyle = ink;
            this.body.forEach(([c, r]) => {
                pen.fillRect(f.x + c * f.cs + gap, f.y + r * f.cs + gap, f.cs - 2 * gap, f.cs - 2 * gap);
            });
            // the food is hollow, so it never reads as a piece of snake
            const fx = f.x + this.food[0] * f.cs + gap;
            const fy = f.y + this.food[1] * f.cs + gap;
            const fs = f.cs - 2 * gap;
            pen.fillRect(fx, fy, fs, fs);
            pen.fillStyle = paper;
            pen.fillRect(fx + 2 * dpr, fy + 2 * dpr, fs - 4 * dpr, fs - 4 * dpr);
        },
        key(event) {
            const ways = {
                ArrowUp: [0, -1], KeyW: [0, -1],
                ArrowDown: [0, 1], KeyS: [0, 1],
                ArrowLeft: [-1, 0], KeyA: [-1, 0],
                ArrowRight: [1, 0], KeyD: [1, 0]
            };
            const way = ways[event.code];
            if (!way) return;
            event.preventDefault();
            this.turn(way[0], way[1]);
        },
        down(event) {
            this.swipe = { x: event.clientX, y: event.clientY };
        },
        up(event) {
            if (!this.swipe) return;
            const dx = event.clientX - this.swipe.x;
            const dy = event.clientY - this.swipe.y;
            this.swipe = null;
            if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) {
                if (!this.alive) this.start();
                return;
            }
            if (Math.abs(dx) > Math.abs(dy)) this.turn(Math.sign(dx), 0);
            else this.turn(0, Math.sign(dy));
        }
    };

    /* --- life --- */

    const life = {
        hint: 'drag to draw · space pauses · r for a new soup · c clears',
        start() {
            const f = this.f = field(8);
            this.grid = new Uint8Array(f.cols * f.rows);
            this.next = new Uint8Array(f.cols * f.rows);
            this.gen = 0;
            this.acc = 0;
            this.running = true;
            this.soup();
            say('');
        },
        soup() {
            for (let i = 0; i < this.grid.length; i += 1) this.grid[i] = Math.random() < 0.22 ? 1 : 0;
            this.gen = 0;
            this.draw();
        },
        show() {
            scoreEl.textContent = `gen ${this.gen}${this.running ? '' : ' · held'}`;
        },
        tick(dt) {
            if (!this.running || this.painting) return;
            this.acc += dt;
            if (this.acc < 90) return;
            this.acc = 0;
            const { cols, rows } = this.f;
            const g = this.grid;
            for (let r = 0; r < rows; r += 1) {
                const up = ((r - 1 + rows) % rows) * cols;
                const at = r * cols;
                const dn = ((r + 1) % rows) * cols;
                for (let c = 0; c < cols; c += 1) {
                    const l = (c - 1 + cols) % cols;
                    const rt = (c + 1) % cols;
                    const n = g[up + l] + g[up + c] + g[up + rt]
                        + g[at + l] + g[at + rt]
                        + g[dn + l] + g[dn + c] + g[dn + rt];
                    this.next[at + c] = n === 3 || (n === 2 && g[at + c]) ? 1 : 0;
                }
            }
            [this.grid, this.next] = [this.next, this.grid];
            this.gen += 1;
            this.draw();
        },
        draw() {
            const f = this.f;
            wipe();
            outline(f.x, f.y, f.cols * f.cs, f.rows * f.cs);
            pen.fillStyle = ink;
            const gap = f.cs > 4 * dpr ? dpr : 0;
            for (let r = 0; r < f.rows; r += 1) {
                for (let c = 0; c < f.cols; c += 1) {
                    if (this.grid[r * f.cols + c]) {
                        pen.fillRect(f.x + c * f.cs, f.y + r * f.cs, f.cs - gap, f.cs - gap);
                    }
                }
            }
            this.show();
        },
        paint(event) {
            const { c, r } = cellAt(this.f, event);
            if (c < 0 || r < 0 || c >= this.f.cols || r >= this.f.rows) return;
            this.grid[r * this.f.cols + c] = this.ink;
            this.draw();
        },
        down(event) {
            const { c, r } = cellAt(this.f, event);
            const inside = c >= 0 && r >= 0 && c < this.f.cols && r < this.f.rows;
            // pressing a live cell rubs out; pressing an empty one draws
            this.ink = inside && this.grid[r * this.f.cols + c] ? 0 : 1;
            this.painting = true;
            this.paint(event);
        },
        move(event) { if (this.painting) this.paint(event); },
        up() { this.painting = false; },
        key(event) {
            if (event.code === 'Space') {
                event.preventDefault();
                this.running = !this.running;
                this.show();
            } else if (event.code === 'KeyR') {
                this.soup();
            } else if (event.code === 'KeyC') {
                this.grid.fill(0);
                this.gen = 0;
                this.draw();
            }
        }
    };

    /* --- chase: a face that would rather not be caught --- */

    const FACES = { calm: '(・ω・)', near: '(°ロ°;)', caught: '(>_<)' };

    const chase = {
        hint: 'catch it — corners help',
        start() {
            wipe();
            say('');
            this.caught = 0;
            this.speed = 1;
            this.held = 0;
            this.vx = 0;
            this.vy = 0;
            this.x = window.innerWidth / 2 - 30;
            this.y = window.innerHeight / 2 - 20;
            this.pointer = { x: -999, y: -999 };
            runner.hidden = false;
            runner.textContent = FACES.calm;
            runner.classList.remove('caught');
            this.show();
            this.place();
        },
        stop() { runner.hidden = true; },
        show() {
            scoreEl.textContent = `caught ${this.caught} · best ${best('front-chase', this.caught)}`;
        },
        place() {
            runner.style.transform = `translate(${Math.round(this.x)}px, ${Math.round(this.y)}px)`;
        },
        tick(dt) {
            const s = Math.min(dt, 40) / 16;
            const w = runner.offsetWidth;
            const h = runner.offsetHeight;
            const cx = this.x + w / 2;
            const cy = this.y + h / 2;
            const dx = cx - this.pointer.x;
            const dy = cy - this.pointer.y;
            const d = Math.hypot(dx, dy) || 1;
            const fear = 170;

            if (this.held > 0) {
                this.held -= dt;
                if (this.held <= 0) {
                    runner.classList.remove('caught');
                    this.jump();
                }
                return;
            }
            if (d < fear) {
                const push = ((fear - d) / fear) * 0.9 * this.speed;
                this.vx += (dx / d) * push * s;
                this.vy += (dy / d) * push * s;
            } else {
                // a little wander, so it isn't a statue while it waits
                this.vx += (Math.random() - 0.5) * 0.15 * s;
                this.vy += (Math.random() - 0.5) * 0.15 * s;
            }
            runner.textContent = d < 110 ? FACES.near : FACES.calm;

            const fr = Math.pow(0.9, s);
            this.vx *= fr;
            this.vy *= fr;
            const cap = 9 * this.speed;
            const v = Math.hypot(this.vx, this.vy);
            if (v > cap) {
                this.vx *= cap / v;
                this.vy *= cap / v;
            }
            this.x += this.vx * s;
            this.y += this.vy * s;

            const left = 16;
            const top = TOP;
            const right = window.innerWidth - 16 - w;
            const bottom = window.innerHeight - FOOT - h;
            if (this.x < left) { this.x = left; this.vx = Math.abs(this.vx) * 0.4; }
            if (this.x > right) { this.x = right; this.vx = -Math.abs(this.vx) * 0.4; }
            if (this.y < top) { this.y = top; this.vy = Math.abs(this.vy) * 0.4; }
            if (this.y > bottom) { this.y = bottom; this.vy = -Math.abs(this.vy) * 0.4; }
            this.place();
        },
        // off to somewhere well away from the hand that caught it
        jump() {
            const w = runner.offsetWidth;
            const h = runner.offsetHeight;
            for (let tries = 0; tries < 30; tries += 1) {
                const x = 16 + Math.random() * (window.innerWidth - 32 - w);
                const y = TOP + Math.random() * (window.innerHeight - TOP - FOOT - h);
                if (Math.hypot(x - this.pointer.x, y - this.pointer.y) > 300 || tries === 29) {
                    this.x = x;
                    this.y = y;
                    break;
                }
            }
            this.vx = 0;
            this.vy = 0;
            runner.textContent = FACES.calm;
            this.place();
        },
        move(event) { this.pointer = { x: event.clientX, y: event.clientY }; },
        down(event) { this.move(event); }
    };

    runner.addEventListener('pointerdown', (event) => {
        event.stopPropagation();
        if (chase.held > 0) return;
        chase.caught += 1;
        chase.speed += 0.12;
        chase.held = 420;
        runner.textContent = FACES.caught;
        runner.classList.add('caught');
        chase.show();
    });

    /* --- draw: a sketchpad of big square pixels --- */

    const draw = {
        hint: 'hold and drag · shift rubs out · c clears',
        start() {
            this.f = field(6);
            this.grid = new Uint8Array(this.f.cols * this.f.rows);
            say('');
            scoreEl.textContent = '';
            this.draw();
        },
        draw() {
            const f = this.f;
            wipe();
            outline(f.x, f.y, f.cols * f.cs, f.rows * f.cs);
            pen.fillStyle = ink;
            for (let r = 0; r < f.rows; r += 1) {
                for (let c = 0; c < f.cols; c += 1) {
                    if (this.grid[r * f.cols + c]) pen.fillRect(f.x + c * f.cs, f.y + r * f.cs, f.cs, f.cs);
                }
            }
        },
        dot(c, r, on) {
            const f = this.f;
            if (c < 0 || r < 0 || c >= f.cols || r >= f.rows) return;
            this.grid[r * f.cols + c] = on;
            pen.fillStyle = on ? ink : paper;
            pen.fillRect(f.x + c * f.cs, f.y + r * f.cs, f.cs, f.cs);
        },
        // every cell between the last point and this one, so a quick
        // stroke is a line and not a row of dots
        line(a, b, on) {
            let { c: x0, r: y0 } = a;
            const { c: x1, r: y1 } = b;
            const dx = Math.abs(x1 - x0);
            const dy = -Math.abs(y1 - y0);
            const sx = x0 < x1 ? 1 : -1;
            const sy = y0 < y1 ? 1 : -1;
            let err = dx + dy;
            for (;;) {
                this.dot(x0, y0, on);
                if (x0 === x1 && y0 === y1) break;
                const e2 = 2 * err;
                if (e2 >= dy) { err += dy; x0 += sx; }
                if (e2 <= dx) { err += dx; y0 += sy; }
            }
        },
        down(event) {
            this.last = cellAt(this.f, event);
            this.line(this.last, this.last, event.shiftKey ? 0 : 1);
        },
        move(event) {
            if (!this.last) return;
            const now = cellAt(this.f, event);
            this.line(this.last, now, event.shiftKey ? 0 : 1);
            this.last = now;
        },
        up() { this.last = null; },
        key(event) {
            if (event.code === 'KeyC') {
                this.grid.fill(0);
                this.draw();
            }
        }
    };

    /* --- picking one, and the loop under all of them --- */

    const TOYS = { snake, life, chase, draw };
    let toy = null;
    let name = 'snake';

    function pick(next) {
        if (toy && toy.stop) toy.stop();
        name = TOYS[next] ? next : 'snake';
        toy = TOYS[name];
        toys.querySelectorAll('button').forEach((button) => {
            button.classList.toggle('on', button.dataset.toy === name);
        });
        hintEl.textContent = toy.hint;
        try { localStorage.setItem('front-toy', name); } catch (error) { /* fine */ }
        toy.start();
    }

    toys.addEventListener('click', (event) => {
        const button = event.target.closest('button');
        if (!button) return;
        pick(button.dataset.toy);
        button.blur();   // or a space for life would press it again
    });

    stage.addEventListener('pointerdown', (event) => {
        if (event.button) return;
        try { stage.setPointerCapture(event.pointerId); } catch (error) { /* fine */ }
        if (toy.down) toy.down(event);
    });
    window.addEventListener('pointermove', (event) => { if (toy.move) toy.move(event); });
    window.addEventListener('pointerup', (event) => { if (toy.up) toy.up(event); });
    window.addEventListener('pointercancel', (event) => { if (toy.up) toy.up(event); });
    window.addEventListener('keydown', (event) => {
        if (event.metaKey || event.ctrlKey || event.altKey) return;
        if (toy.key) toy.key(event);
    });

    let last = performance.now();
    function frame(now) {
        const dt = Math.min(now - last, 250);
        last = now;
        if (toy.tick) toy.tick(dt);
        requestAnimationFrame(frame);
    }

    let resizeTimer = 0;
    window.addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => {
            size();
            toy.start();
        }, 120);
    });

    colours();
    size();
    let saved = 'snake';
    try { saved = localStorage.getItem('front-toy') || 'snake'; } catch (error) { /* fine */ }
    pick(saved);
    requestAnimationFrame(frame);
}());
</script>
</body>
</html>
