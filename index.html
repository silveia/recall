<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>recall - flashcards</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <button class="home-button" id="homeButton" type="button">home</button>
    <div class="context-menu" id="contextMenu" hidden></div>

    <main>
        <section class="screen actions-only" id="homeScreen" aria-label="Home">
            <section class="deck-organizer" aria-label="deck organizer">
                <h2>decks</h2>
                <form id="deckForm" class="deck-form">
                    <input id="deckNameInput" type="text" required placeholder="new deck name">
                    <button class="basic-button" type="submit">create deck</button>
                </form>
                <div id="deckList"></div>
            </section>
            <section class="quick-panel" aria-label="flashcard actions">
                <button class="quick-action primary" id="createCardButton" type="button"><span class="action-icon">+</span><span><strong>create</strong><small>ʕ•ᴥ•ʔﾉ</small></span><b>→</b></button>
                <button class="quick-action" id="randomStudyButton" type="button"><span class="action-icon play">▶</span><span><strong>practice</strong><small>.❛ ᴗ ❛.</small></span><b>→</b></button>
            </section>
        </section>

        <section class="screen maker-screen" id="makerScreen" hidden>
            <h1>create</h1>
            <p>add a question bih</p>
            <form id="cardForm">
                <label for="questionInput">question</label>
                <textarea id="questionInput" required placeholder="question here"></textarea>
                <label for="answerInput">answer</label>
                <textarea id="answerInput" required placeholder="im going to demolish u"></textarea>
                <button class="basic-button" id="cardSubmitButton" type="submit">add flashcard</button>
            </form>
            <h2>current cards</h2>
            <ol id="cardList"><li class="empty-message">no cards :(</li></ol>
        </section>

        <section class="screen study-screen" id="studyScreen" hidden>
            <h1>practice</h1>
            <div class="question-box">
                <h2 id="studyQuestion"></h2>
                <div class="answer-options" id="answerOptions"></div>
                <p id="studyFeedback" aria-live="polite"></p>
            </div>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
